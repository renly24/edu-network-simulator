name: Inspect FTP server (read-only)

# FTP サーバーの状況を確認するだけのワークフロー。
# アップロード・削除・フォルダー作成は一切行わない。
on:
  push:
    branches:
      - "claude/vibrant-ritchie-cddvqa"
    paths:
      - ".github/workflows/ftp-inspect.yml"
  workflow_dispatch:
    inputs:
      allow_plain:
        description: "FTPS で接続できない場合に暗号化なしの FTP を試す（パスワードが平文で流れます）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
      PROJECT_DIR: edu-network-simulator
      ALLOW_PLAIN: ${{ inputs.allow_plain || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in FTP_HOST FTP_USER LFTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Repository secrets FTP_HOST / FTP_USER / FTP_PASS が読めません。"
            echo "Environment secrets に登録した場合、このジョブからは参照できません。"
            exit 1
          fi
          echo "All secrets are set."

      - name: Check public URL mapping
        run: |
          base=http://e.gmobb.jp/omaesensei
          for path in / /digital/ /digital/BindecComplementGame/ /digital/edu-network-simulator/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$base$path")
            echo "$code $base$path"
          done
          echo "--- asset paths referenced by BindecComplementGame ---"
          curl -s --max-time 15 "$base/digital/BindecComplementGame/" \
            | grep -oE '"/[^"]*/_next/' | sort -u || true

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Check FTPS support
        id: tls
        run: |
          try() {
            # -c は最後のコマンドの終了コードを返す。cls で実際にログインさせる
            lftp -c "
              set net:timeout 15; set net:max-retries 1;
              $1
              open --env-password -u '$FTP_USER' '$FTP_HOST';
              cls -1 >/dev/null"
          }
          if try "set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes;"; then
            echo "mode=ftps" >> "$GITHUB_OUTPUT"
            echo "FTPS (certificate verified): OK"
          elif try "set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no;"; then
            echo "mode=ftps-noverify" >> "$GITHUB_OUTPUT"
            echo "FTPS (certificate NOT verified): OK"
          elif [ "$ALLOW_PLAIN" = "true" ] && try "set ftp:ssl-allow no;"; then
            echo "mode=plain" >> "$GITHUB_OUTPUT"
            echo "Plain FTP (no encryption): OK"
          else
            echo "::error::Could not log in with FTPS. Plain FTP was not tried (allow_plain=$ALLOW_PLAIN)."
            exit 1
          fi

      - name: Check pinned certificate login
        # deploy-ftp.yml と同じ設定（指紋で固定した証明書だけを信頼）でログインできるか
        run: |
          fp=$(grep -oP 'FTP_CERT_FINGERPRINT: "\K[^"]+' .github/workflows/deploy-ftp.yml)
          lftp -c "
            set net:timeout 15; set net:max-retries 1;
            set ftp:ssl-force yes; set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/$fp no;
            open --env-password -u '$FTP_USER' '$FTP_HOST';
            cls -1 >/dev/null" && echo "Pinned certificate login: OK"

      - name: List server contents
        env:
          MODE: ${{ steps.tls.outputs.mode }}
        run: |
          case "$MODE" in
            ftps)          opts="set ftp:ssl-force yes; set ftp:ssl-protect-data yes;" ;;
            ftps-noverify) opts="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no;" ;;
            plain)         opts="set ftp:ssl-allow no;" ;;
          esac
          lftp -c "
            set net:timeout 15; set net:max-retries 1;
            $opts
            open --env-password -u '$FTP_USER' '$FTP_HOST';
            echo '=== login directory ==='; pwd;
            echo '=== server features (FEAT) ==='; quote FEAT;
            echo '=== / ==='; cls -la /;
            echo '=== login directory ==='; cls -la;
            echo '=== digital ==='; cls -la digital/;
            echo '=== digital/$PROJECT_DIR ==='; cls -la digital/$PROJECT_DIR/;
            echo '=== done ==='"
