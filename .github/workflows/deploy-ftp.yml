name: Deploy to FTP server

# main へ push すると、ビルドして FTP サーバーの digital/edu-network-simulator に
# アップロードする。公開 URL: http://e.gmobb.jp/omaesensei/digital/edu-network-simulator/
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ftp-deploy"
  cancel-in-progress: false

env:
  # FTP サーバー上のアップロード先（ログイン直後のフォルダーからの相対パス）
  REMOTE_DIR: digital/edu-network-simulator
  # 公開 URL のパス部分。FTP のルートは http://e.gmobb.jp/omaesensei/ に対応する
  BASE_PATH: /omaesensei/digital/edu-network-simulator
  # サーバー証明書は発行元が不明なため、この証明書（SHA-1 指紋）だけを信頼する。
  # サーバーの証明書が更新されたら、ftp-inspect の結果を見てここを更新する。
  FTP_CERT_FINGERPRINT: "09:5C:41:9E:84:B7:C8:6D:37:F7:48:B4:27:BB:1B:43:89:D9:C2:24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}

      # FTP サーバーは名前に ".." を含むファイルを受け付けないので、改名して参照も直す
      - name: Rename files the FTP server rejects
        run: node scripts/sanitize-export.mjs out

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          # --delete はアップロード先フォルダーの中だけに効く（他の教材には触れない）
          lftp -c "
            set net:timeout 30; set net:max-retries 2;
            set ftp:ssl-force yes; set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no;
            open --env-password -u '$FTP_USER' '$FTP_HOST';
            mirror --reverse --delete --verbose --parallel=4 out/ '$REMOTE_DIR/'"

      - name: Check the published page
        run: |
          url="http://e.gmobb.jp$BASE_PATH/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          echo "$code $url"
          test "$code" = 200
